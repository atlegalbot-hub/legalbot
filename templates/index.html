<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Constitution & Law Tutor</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%231a2a3a'/><text x='50' y='58' font-size='48' text-anchor='middle' fill='%23fff'>§</text></svg>">
  <meta name="color-scheme" content="dark light">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">§</div>
        <div>
          <div class="title">Constitution Tutor</div>
          <div class="subtitle">For Classes 8–12</div>
        </div>
      </div>
      <div class="controls">
        <button id="btn-history" class="btn secondary">Refresh History</button>
        <button id="btn-export" class="btn secondary">Export History</button>
        <button id="btn-timeline" class="btn">Indian Constitution History</button>
        <label class="btn secondary" for="file-input">Upload PDF</label>
        <input id="file-input" type="file" accept="application/pdf" style="display:none">
      </div>
      <div class="panel">
        <div class="panel-title">Previous Questions</div>
        <ul id="history-list" class="history-list"></ul>
      </div>
      <div class="panel">
        <div class="panel-title">My Uploads</div>
        <ul id="uploads-list" class="history-list"></ul>
      </div>
      <div class="panel">
        <div class="panel-title">Optimization Metrics</div>
        <div id="metrics" class="metrics">
          <div><span>Total chats</span><b id="m-total">0</b></div>
          <div><span>Avg response</span><b id="m-avg">0 ms</b></div>
          <div><span>Helpful rate</span><b id="m-helpful">0%</b></div>
          <div class="top-docs">
            <div class="top-title">Top referenced:</div>
            <ul id="m-top"></ul>
          </div>
        </div>
      </div>
    </aside>
    <main class="main">
      <div class="chat-container" id="chat"></div>
      <div class="composer">
        <input id="input" class="input" placeholder="Ask about Articles, rights, scenarios... e.g., 'If a student is suspended for speech, what rights apply?'" />
        <button id="send" class="btn">Send</button>
      </div>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
<style>
</style>
</html>
